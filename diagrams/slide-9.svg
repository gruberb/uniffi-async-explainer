<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img"><title>What does Rust await? The foreign side</title><desc>UniFFI supports async trait implementations in either language. Its generated Kotlin bridge starts a coroutine; its Swift bridge starts a Task. Each bridge sends the implementation’s result or error to Rust through a result callback.</desc><style>text {font:20px Arial,sans-serif;fill:#152a40}.heading{font-size:23px;font-weight:600}.box rect{fill:#e7ecfa;stroke:#b9c6e9;stroke-width:1.5px}.app rect{fill:#e8f3ee;stroke:#abcbbd}.sync rect{fill:#f8eded;stroke:#d4b3b3}.bridge rect{fill:#f0eef8;stroke:#c9c2de}.arrow{fill:none;stroke:#536179;stroke-width:2px}.green{fill:#20583f}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#536179"/></marker></defs>
<text x="0" y="26" class="heading" text-anchor="start">Rust → Kotlin implementation</text>
<g class="box "><rect x="0" y="44" width="270" height="92" rx="8"/><text x="18" y="73" class="heading" text-anchor="start">Rust future</text><text x="18" y="100" class="" text-anchor="start">Awaits an async</text><text x="18" y="125" class="" text-anchor="start">trait method.</text></g>
<path class="arrow" d="M272 90 H315" marker-end="url(#arrow)"/>
<g class="box bridge"><rect x="325" y="44" width="400" height="92" rx="8"/><text x="343" y="73" class="heading" text-anchor="start">Generated Kotlin bridge</text><text x="343" y="100" class="" text-anchor="start">Starts GlobalScope.launch.</text></g>
<path class="arrow" d="M727 90 H770" marker-end="url(#arrow)"/>
<g class="box app"><rect x="780" y="44" width="340" height="92" rx="8"/><text x="798" y="73" class="heading" text-anchor="start">Kotlin async code</text><text x="798" y="100" class="" text-anchor="start">Returns a value or error.</text></g>
<path class="arrow" d="M1080 159 H30" marker-end="url(#arrow)"/>
<text x="560" y="187" class="" text-anchor="middle">A result callback passes that value or error back to Rust.</text>
<text x="0" y="224" class="heading" text-anchor="start">Rust → Swift implementation</text>
<g class="box "><rect x="0" y="242" width="270" height="92" rx="8"/><text x="18" y="271" class="heading" text-anchor="start">Rust future</text><text x="18" y="298" class="" text-anchor="start">Awaits an async</text><text x="18" y="323" class="" text-anchor="start">trait method.</text></g>
<path class="arrow" d="M272 288 H315" marker-end="url(#arrow)"/>
<g class="box bridge"><rect x="325" y="242" width="400" height="92" rx="8"/><text x="343" y="271" class="heading" text-anchor="start">Generated Swift bridge</text><text x="343" y="298" class="" text-anchor="start">Starts a Swift Task.</text></g>
<path class="arrow" d="M727 288 H770" marker-end="url(#arrow)"/>
<g class="box app"><rect x="780" y="242" width="340" height="92" rx="8"/><text x="798" y="271" class="heading" text-anchor="start">Swift async code</text><text x="798" y="298" class="" text-anchor="start">Returns a value or error.</text></g>
<path class="arrow" d="M1080 357 H30" marker-end="url(#arrow)"/>
<text x="560" y="385" class="" text-anchor="middle">A result callback passes that value or error back to Rust.</text>
</svg>
