<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 315" role="img"><title>Async Rust removes the sync-to-async layer</title><desc>Today, app callers use a handwritten Kotlin or Swift async adapter, then generated synchronous bindings, then a synchronous Rust function. With an async Rust API, app callers use generated async bindings directly; the sync-to-async part of the app wrapper can be removed while its other responsibilities remain.</desc><style>text {font:20px Arial,sans-serif;fill:#152a40}.heading{font-size:23px;font-weight:600}.box rect{fill:#e7ecfa;stroke:#b9c6e9;stroke-width:1.5px}.app rect{fill:#e8f3ee;stroke:#abcbbd}.sync rect{fill:#f8eded;stroke:#d4b3b3}.bridge rect{fill:#f0eef8;stroke:#c9c2de}.arrow{fill:none;stroke:#536179;stroke-width:2px}.green{fill:#20583f}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#536179"/></marker></defs>
<text x="0" y="25" class="heading" text-anchor="start">Today: the app wrapper dispatches a synchronous call</text>
<g class="box app"><rect x="0" y="43" width="210" height="96" rx="8"/><text x="18" y="72" class="heading" text-anchor="start">App caller</text><text x="18" y="99" class="" text-anchor="start">Kotlin / Swift</text></g>
<path class="arrow" d="M212 91 H235" marker-end="url(#arrow)"/>
<g class="box sync"><rect x="245" y="43" width="245" height="96" rx="8"/><text x="263" y="72" class="heading" text-anchor="start">Async dispatch</text><text x="263" y="99" class="" text-anchor="start">withContext (Kotlin)</text><text x="263" y="124" class="" text-anchor="start">queue.async (Swift)</text></g>
<path class="arrow" d="M492 91 H515" marker-end="url(#arrow)"/>
<g class="box bridge"><rect x="525" y="43" width="270" height="96" rx="8"/><text x="543" y="72" class="heading" text-anchor="start">Generated bindings</text><text x="543" y="99" class="" text-anchor="start">Synchronous calls</text><text x="543" y="124" class="" text-anchor="start">in Kotlin and Swift</text></g>
<path class="arrow" d="M797 91 H820" marker-end="url(#arrow)"/>
<g class="box "><rect x="830" y="43" width="290" height="96" rx="8"/><text x="848" y="72" class="heading" text-anchor="start">Sync Rust function</text><text x="848" y="99" class="" text-anchor="start">Occupies a thread.</text></g>
<text x="0" y="188" class="heading" text-anchor="start">Async component API: call the generated async binding directly</text>
<g class="box app"><rect x="0" y="207" width="210" height="96" rx="8"/><text x="18" y="236" class="heading" text-anchor="start">App caller</text><text x="18" y="263" class="" text-anchor="start">Kotlin coroutine</text><text x="18" y="288" class="" text-anchor="start">or Swift Task</text></g>
<text x="367" y="238" class="heading green" text-anchor="middle">Async dispatch removed</text>
<path class="arrow" d="M212 272 H515" marker-end="url(#arrow)"/>
<g class="box bridge"><rect x="525" y="207" width="270" height="96" rx="8"/><text x="543" y="236" class="heading" text-anchor="start">Generated bindings</text><text x="543" y="263" class="" text-anchor="start">Kotlin suspend</text><text x="543" y="288" class="" text-anchor="start">Swift async</text></g>
<path class="arrow" d="M797 255 H820" marker-end="url(#arrow)"/>
<g class="box "><rect x="830" y="207" width="290" height="96" rx="8"/><text x="848" y="236" class="heading" text-anchor="start">Async Rust function</text><text x="848" y="263" class="" text-anchor="start">Creates a Rust future.</text></g>
</svg>
