<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 325" role="img">
<title>UniFFI generates code on both sides</title>
<desc>The Kotlin generated code is compiled into Fenix and the Swift generated code into Firefox iOS. Both call generated FFI entry points inside the native Rust library, which then call the authored Rust function.</desc>
<style>text { font: 20px Arial, sans-serif; fill: #152a40; }
.box-title { font-weight: 600; font-size: 23px; }
.box rect { fill: #e7ecfa; stroke: #b9c6e9; stroke-width: 1.5px; }
.foreign rect { fill: #e8f3ee; stroke: #abcbbd; }
.bridge rect { fill: #f0eef8; stroke: #c9c2de; }
.wait rect { fill: #f8eded; stroke: #d4b3b3; }
.arrow { fill: none; stroke: #536179; stroke-width: 2px; }
.dashed { stroke-dasharray: 6 5; }
.edge-label { font-size: 19px; }
.lane-title { font-size: 24px; font-weight: 600; }
.lifeline { fill: none; stroke: #b4bed0; stroke-width: 2px; stroke-dasharray: 4 5; }
.idle-band { fill: #e8f3ee; }
.idle-text { font-size: 20px; fill: #20583f; }</style>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="#536179"/>
</marker>
</defs>
<text x="0" y="25" class="lane-title" text-anchor="start">Code compiled with the app</text>
<rect x="410" y="0" width="710" height="310" rx="9" fill="#edf1f8" stroke="#b9c6e9"/>
<text x="430" y="28" class="lane-title" text-anchor="start">Native Rust library: component + generated FFI functions</text>
<g class="box foreign">
<rect x="0" y="55" width="300" height="95" rx="8"/>
<text x="18" y="86" class="box-title" text-anchor="start">Kotlin generated code</text>
<text x="18" y="115" class="" text-anchor="start">Compiled into Fenix.</text>
</g>
<g class="box foreign">
<rect x="0" y="205" width="300" height="95" rx="8"/>
<text x="18" y="236" class="box-title" text-anchor="start">Swift generated code</text>
<text x="18" y="265" class="" text-anchor="start">Compiled into Firefox iOS.</text>
</g>
<path class="arrow " d="M300,100 L460,100" marker-end="url(#arrow)"/>
<path class="arrow " d="M300,250 L460,250" marker-end="url(#arrow)"/>
<g class="box bridge">
<rect x="460" y="55" width="285" height="245" rx="8"/>
<text x="478" y="86" class="box-title" text-anchor="start">Rust FFI entry points</text>
<text x="478" y="115" class="" text-anchor="start">Generated by UniFFI</text>
<text x="478" y="140" class="" text-anchor="start">during Rust compilation.</text>
<text x="478" y="165" class="" text-anchor="start">They convert the input</text>
<text x="478" y="190" class="" text-anchor="start">and call our function.</text>
</g>
<path class="arrow " d="M745,180 L820,180" marker-end="url(#arrow)"/>
<g class="box native">
<rect x="820" y="120" width="275" height="130" rx="8"/>
<text x="838" y="151" class="box-title" text-anchor="start">Our Rust function</text>
<text x="838" y="180" class="" text-anchor="start">greet(String)</text>
<text x="838" y="205" class="" text-anchor="start">returns String</text>
</g>
</svg>
