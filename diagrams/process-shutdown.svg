<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img">
<title>When the app process ends, its Rust work ends too</title>
<desc>A synchronous Rust call and an async Rust future both live inside the app process. When that process terminates, all its threads stop and the OS reclaims its stack and heap memory. A new launch cannot resume the old future. Saved data and requests already sent may survive.</desc>
<style>text { font: 20px Arial, sans-serif; fill: #152a40; }
.box-title { font-weight: 600; font-size: 23px; }
.box rect { fill: #e7ecfa; stroke: #b9c6e9; stroke-width: 1.5px; }
.foreign rect { fill: #e8f3ee; stroke: #abcbbd; }
.bridge rect { fill: #f0eef8; stroke: #c9c2de; }
.wait rect { fill: #f8eded; stroke: #d4b3b3; }
.arrow { fill: none; stroke: #536179; stroke-width: 2px; }
.dashed { stroke-dasharray: 6 5; }
.edge-label { font-size: 19px; }
.lane-title { font-size: 24px; font-weight: 600; }
.lifeline { fill: none; stroke: #b4bed0; stroke-width: 2px; stroke-dasharray: 4 5; }
.idle-band { fill: #e8f3ee; }
.idle-text { font-size: 20px; fill: #20583f; }</style>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="#536179"/>
</marker>
</defs>
<text x="0" y="25" class="lane-title" text-anchor="start">While the app process exists</text>
<g class="box wait">
<rect x="0" y="60" width="235" height="105" rx="8"/>
<text x="18" y="91" class="box-title" text-anchor="start">Synchronous call</text>
<text x="18" y="120" class="" text-anchor="start">Its thread is running</text>
<text x="18" y="145" class="" text-anchor="start">or waiting inside Rust.</text>
</g>
<path class="arrow " d="M235,112 L420,112" marker-end="url(#arrow)"/>
<g class="box bridge">
<rect x="420" y="60" width="350" height="105" rx="8"/>
<text x="438" y="91" class="box-title" text-anchor="start">Active thread and stack</text>
<text x="438" y="120" class="" text-anchor="start">The call has not returned.</text>
</g>
<g class="box foreign">
<rect x="0" y="220" width="235" height="130" rx="8"/>
<text x="18" y="251" class="box-title" text-anchor="start">Async call</text>
<text x="18" y="280" class="" text-anchor="start">The future may be</text>
<text x="18" y="305" class="" text-anchor="start">waiting between polls</text>
<text x="18" y="330" class="" text-anchor="start">or running inside poll.</text>
</g>
<path class="arrow " d="M235,285 L420,285" marker-end="url(#arrow)"/>
<g class="box native">
<rect x="420" y="220" width="350" height="130" rx="8"/>
<text x="438" y="251" class="box-title" text-anchor="start">Future stored on the heap</text>
<text x="438" y="280" class="" text-anchor="start">Its values remain in memory</text>
<text x="438" y="305" class="" text-anchor="start">while the operation waits.</text>
</g>
<path d="M830,45 V365" stroke="#b85454" stroke-width="4" stroke-dasharray="8 5"/>
<text x="830" y="25" class="lane-title" text-anchor="middle">Process ends</text>
<path class="arrow " d="M770,112 L915,112" marker-end="url(#arrow)"/>
<path class="arrow " d="M770,285 L915,285" marker-end="url(#arrow)"/>
<g class="box wait">
<rect x="915" y="60" width="205" height="290" rx="8"/>
<text x="933" y="91" class="box-title" text-anchor="start">Both stop</text>
<text x="933" y="120" class="" text-anchor="start">All process</text>
<text x="933" y="145" class="" text-anchor="start">threads stop.</text>
<text x="933" y="170" class="" text-anchor="start">The OS reclaims</text>
<text x="933" y="195" class="" text-anchor="start">its stacks and</text>
<text x="933" y="220" class="" text-anchor="start">heap memory.</text>
</g>
<text x="560" y="410" class="edge-label" text-anchor="middle">A new launch starts a new process. Saved data and requests already sent can outlive the old one.</text>
</svg>
