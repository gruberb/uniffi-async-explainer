<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 315" role="img">
<title>Cancelling the call does not stop everything</title>
<desc>Cancelling the Kotlin Job lets the helper free its Rust future. If Rust was waiting for another Kotlin task, dropping that future can cancel the task too. A network call may continue if it cannot be interrupted.</desc>
<style>text { font: 20px Arial, sans-serif; fill: #152a40; }
.box-title { font-weight: 600; font-size: 23px; }
.box rect { fill: #e7ecfa; stroke: #b9c6e9; stroke-width: 1.5px; }
.foreign rect { fill: #e8f3ee; stroke: #abcbbd; }
.bridge rect { fill: #f0eef8; stroke: #c9c2de; }
.wait rect { fill: #f8eded; stroke: #d4b3b3; }
.arrow { fill: none; stroke: #536179; stroke-width: 2px; }
.dashed { stroke-dasharray: 6 5; }
.edge-label { font-size: 19px; }
.lane-title { font-size: 24px; font-weight: 600; }
.lifeline { fill: none; stroke: #b4bed0; stroke-width: 2px; stroke-dasharray: 4 5; }
.idle-band { fill: #e8f3ee; }
.idle-text { font-size: 20px; fill: #20583f; }</style>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8 z" fill="#536179"/>
</marker>
</defs>
<g class="box foreign">
<rect x="0" y="65" width="235" height="150" rx="8"/>
<text x="18" y="96" class="box-title" text-anchor="start">The app cancels</text>
<text x="18" y="125" class="" text-anchor="start">It cancels the</text>
<text x="18" y="150" class="" text-anchor="start">calling Kotlin Job.</text>
</g>
<path class="arrow " d="M235,140 L295,140" marker-end="url(#arrow)"/>
<g class="box bridge">
<rect x="295" y="65" width="235" height="150" rx="8"/>
<text x="313" y="96" class="box-title" text-anchor="start">UniFFI cleans up</text>
<text x="313" y="125" class="" text-anchor="start">The helper frees</text>
<text x="313" y="150" class="" text-anchor="start">the Rust future</text>
<text x="313" y="175" class="" text-anchor="start">when it exits.</text>
</g>
<path class="arrow " d="M530,140 L590,140" marker-end="url(#arrow)"/>
<g class="box foreign">
<rect x="590" y="65" width="235" height="150" rx="8"/>
<text x="608" y="96" class="box-title" text-anchor="start">If it called Kotlin</text>
<text x="608" y="125" class="" text-anchor="start">Dropping that future</text>
<text x="608" y="150" class="" text-anchor="start">can also cancel the</text>
<text x="608" y="175" class="" text-anchor="start">Kotlin backend Job.</text>
</g>
<path class="arrow dashed" d="M825,140 L885,140" marker-end="url(#arrow)"/>
<g class="box wait">
<rect x="885" y="65" width="235" height="150" rx="8"/>
<text x="903" y="96" class="box-title" text-anchor="start">The request</text>
<text x="903" y="125" class="" text-anchor="start">A network call may</text>
<text x="903" y="150" class="" text-anchor="start">still be running</text>
<text x="903" y="175" class="" text-anchor="start">unless it can stop.</text>
</g>
<text x="560" y="285" class="edge-label" text-anchor="middle">Cancelling work cannot undo a request that has already been sent.</text>
</svg>
